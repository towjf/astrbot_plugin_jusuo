name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          python -m pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate metadata.yaml
        run: |
          python - <<'PY'
          import pathlib
          import sys

          try:
              import yaml
          except ImportError:
              sys.exit(0)

          data = yaml.safe_load(pathlib.Path("metadata.yaml").read_text(encoding="utf-8"))
          required = ("name", "desc", "version", "author")
          missing = [k for k in required if not str(data.get(k, "")).strip()]
          if missing:
              sys.exit(f"metadata.yaml 缺少必填字段: {missing}")
          print("metadata.yaml OK:", data["name"], data["version"])
          PY
