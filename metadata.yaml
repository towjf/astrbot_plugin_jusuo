name: astrbot_plugin_jusuo
display_name: 居所助手
short_desc: 王者荣耀世界：菜地/牧场高倍收购、物品清单与行情查询
desc: |
  王者荣耀世界「居所助手」数据查询插件，数据来自玩家自发分享的 jusuo.playmmo.cn。

  功能：
  - `/菜地`、`/牧场`：按物品筛选的高倍收购列表，支持单价/售价两种排序与翻页，附带商人 UID、等级、剩余时间与预估售价；
  - `/物品列表`：一键列出菜地与牧场当前在售的全部物品名；
  - `/行情`：近 N 小时各物品的最高成交估价峰值。

  出图为本地 Pillow 绘制（深蓝配色、PNG 直出、不联网、单张约 0.2 秒），渲染失败时自动退纯文本。
  所有命令必须带 `/` 触发，不带斜杠的消息按普通聊天处理。
help: 发送 /居所帮助 查看全部命令（命令必须带 /）
version: 1.5.0
